root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o bin/scribehost cmd/scribehost/main.go"
bin = "bin/scribehost"
delay = 1000
exclude_dir = ["bin", "tmp", "logs", "migrations"]
include_ext = ["go", "tpl", "tmpl", "html"]
stop_on_error = true
log = "tmp/build-errors.log"

[run]
cmd = "bin/scribehost"
